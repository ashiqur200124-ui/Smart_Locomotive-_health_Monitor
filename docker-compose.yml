version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: locomotive_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locomotive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-locomotive_monitor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locomotive}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - locomotive_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: locomotive_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - locomotive_network

  # MQTT Broker (for IoT sensors)
  mqtt:
    image: eclipse-mosquitto:2
    container_name: locomotive_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mqtt_data:/mosquitto/data
    networks:
      - locomotive_network

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locomotive_backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_APP: app_v2.py
      DATABASE_URL: postgresql://${POSTGRES_USER:-locomotive}:${POSTGRES_PASSWORD:-secure_password}@db:5432/${POSTGRES_DB:-locomotive_monitor}
      REDIS_URL: redis://redis:6379/0
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      flask db init &&
      flask db migrate &&
      flask db upgrade &&
      gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 app_v2:app
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - locomotive_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: locomotive_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - locomotive_network

  # Pgadmin (Database UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: locomotive_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - locomotive_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mqtt_data:
    driver: local

networks:
  locomotive_network:
    driver: bridge
